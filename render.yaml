services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: phc-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: 8000
      - key: DB_HOST
        value: dpg-db7kggrncjis73elfo1g-a
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: raja_ka_project
      - key: DB_USER
        value: raja_ka_project_user
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: public
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ADMIN_SIGNUP_CODE
        value: "150"
      - key: APP_TIMEZONE
        value: Asia/Kolkata

  # 2. Next.js Frontend Web Service
  - type: web
    name: phc-frontend
    runtime: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: BACKEND_URL
        value: https://phc-backend.onrender.com