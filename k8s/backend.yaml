apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: phc-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phc-backend
  template:
    metadata:
      labels:
        app: phc-backend
    spec:
      containers:
        - name: backend-container
          image: ankitt2026/phc-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: phc-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080