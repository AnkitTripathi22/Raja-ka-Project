apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_HOST: "host.docker.internal"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  DB_USER: "postgres"
  DB_SCHEMA: "public"
  APP_TIMEZONE: "Asia/Kolkata"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  DB_PASSWORD: "admin123"
  SECRET_KEY: "k8s-super-secret-key-12345"
  ADMIN_SIGNUP_CODE: "150"